name: SMP Trading Bot

on:
  schedule:
    - cron: '0 */4 * * *'      # her 4 saatte bir: kripto + BIST100 birlikte
  workflow_dispatch:

permissions:
  contents: write   # state/*.json dosyalarini geri commit'lemek icin gerekli

jobs:
  smp_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy scipy requests yfinance vectorbt optuna

      - name: SMP Tarama (Kripto + BIST100)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python telegram_bot.py scan

      - name: State dosyalarini commit'le (dedup hafizasi)
        run: |
          git config user.name "smp-bot"
          git config user.email "smp-bot@users.noreply.github.com"
          # [FIX] eskiden sadece bist_state.json commit ediliyordu --
          # crypto_state.json artik telegram_bot.py tarafindan da
          # yaziliyor, o da commit edilmezse GitHub Actions runner'i her
          # calistiginda sifirdan basliyor (dosya sistemi ephemeral) ve
          # kripto tarafinda dedup hic KALICI olmuyordu.
          git add state/bist_state.json state/crypto_state.json || true
          git diff --cached --quiet || git commit -m "chore: update signal state [skip ci]"
          git push || true