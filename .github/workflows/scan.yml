name: SMP Trading Bot

on:
  schedule:
    - cron: '0 */4 * * *'      # SMP: her 4 saatte bir
    - cron: '30 15 * * 1-5'    # KRAKEN: hafta ici 18:30 TR saati
  workflow_dispatch:

jobs:
  smp_scan:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 */4 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy scipy requests yfinance vectorbt optuna

      - name: SMP V3.1 Tarama
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python telegram_bot.py scan

  kraken_scan:
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 15 * * 1-5' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy scipy requests yfinance vectorbt optuna

      - name: KRAKEN BIST100 Tarama
        env:
          KRAKEN_BOT_TOKEN: ${{ secrets.KRAKEN_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python kraken_bot.py scan